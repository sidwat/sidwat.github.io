name: Deploy to GitHub Pages

on:
  push:
    branches: ["master", "nextjs-rebuild"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      # Node 22, not 20: pnpm 11 requires >= 22.13.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Basic release QA (blocks artifact upload on failure)
        run: pnpm qa:release
        # Repository *variables* (not secrets): both values are public by design and
        # end up in the browser bundle. Never map a real secret to NEXT_PUBLIC_*.
        env:
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
          NEXT_PUBLIC_CONTACT_ACCESS_KEY: ${{ vars.CONTACT_ACCESS_KEY }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-qa
          path: node_modules/.cache/release-qa/
          include-hidden-files: true
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Guarded to the default branch: pushes to nextjs-rebuild still build and
  # upload an artifact, proving the branch compiles, but only master publishes.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
