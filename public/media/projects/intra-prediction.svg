<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Intra-frame prediction from neighbouring pixels</title><desc id="desc">Within one frame, decoded reference pixels above and left of a target block inform a neural predictor. The predicted block continues the local diagonal pattern. Conceptual illustration, not measured output.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102033"/><stop offset="1" stop-color="#09131f"/></linearGradient><pattern id="texture" width="86" height="86" patternUnits="userSpaceOnUse" patternTransform="rotate(-32)"><rect width="86" height="86" fill="#174657"/><rect width="36" height="86" fill="#4cb3b0"/><rect x="36" width="10" height="86" fill="#89ded2"/></pattern><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#07121c" stroke-opacity=".32" stroke-width="1"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#9fc6ff" stroke-width="1.5"/></marker><clipPath id="frame"><rect x="55" y="135" width="480" height="390" rx="12"/></clipPath></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="55" y="65" fill="#f3f6fb" font-size="30" font-weight="700">Predict a block from the same frame</text><text x="55" y="103" fill="#aebdce" font-size="20">Neighbouring pixels provide the context. The model infers the pattern.</text>
<g clip-path="url(#frame)"><rect x="55" y="135" width="480" height="390" fill="url(#texture)"/><rect x="55" y="135" width="480" height="390" fill="url(#grid)"/>
<rect x="265" y="285" width="180" height="180" fill="#101e31"/>
<path d="M235 465V255H445" fill="none" stroke="#ffcd78" stroke-width="26" stroke-opacity=".95"/>
<path d="M265 285H445V465H265Z" fill="none" stroke="#9fc6ff" stroke-width="3" stroke-dasharray="9 7"/>
<text x="355" y="365" text-anchor="middle" fill="#d9e7fc" font-size="22" font-weight="700">Target block</text><text x="355" y="397" text-anchor="middle" fill="#aebdce" font-size="18">to predict</text></g>
<text x="55" y="563" fill="#ffcd78" font-size="21" font-weight="700">Highlighted: decoded reference pixels</text><text x="55" y="594" fill="#aebdce" font-size="19">Above + left of the target, in this same image</text>
<path d="M550 340H625" fill="none" stroke="#9fc6ff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="643" y="273" width="170" height="135" rx="18" fill="#1c3350" stroke="#587aa3"/>
<g fill="#c3ddff"><circle cx="675" cy="305" r="5"/><circle cx="675" cy="340" r="5"/><circle cx="675" cy="375" r="5"/><circle cx="727" cy="305" r="5"/><circle cx="727" cy="340" r="5"/><circle cx="727" cy="375" r="5"/><circle cx="779" cy="305" r="5"/><circle cx="779" cy="340" r="5"/><circle cx="779" cy="375" r="5"/><path d="M675 305L727 305" stroke="#8bbcff" stroke-opacity=".28"/><path d="M675 305L727 340" stroke="#8bbcff" stroke-opacity=".28"/><path d="M675 305L727 375" stroke="#8bbcff" stroke-opacity=".28"/><path d="M675 340L727 305" stroke="#8bbcff" stroke-opacity=".28"/><path d="M675 340L727 340" stroke="#8bbcff" stroke-opacity=".28"/><path d="M675 340L727 375" stroke="#8bbcff" stroke-opacity=".28"/><path d="M675 375L727 305" stroke="#8bbcff" stroke-opacity=".28"/><path d="M675 375L727 340" stroke="#8bbcff" stroke-opacity=".28"/><path d="M675 375L727 375" stroke="#8bbcff" stroke-opacity=".28"/><path d="M727 305L779 305" stroke="#8bbcff" stroke-opacity=".28"/><path d="M727 305L779 340" stroke="#8bbcff" stroke-opacity=".28"/><path d="M727 305L779 375" stroke="#8bbcff" stroke-opacity=".28"/><path d="M727 340L779 305" stroke="#8bbcff" stroke-opacity=".28"/><path d="M727 340L779 340" stroke="#8bbcff" stroke-opacity=".28"/><path d="M727 340L779 375" stroke="#8bbcff" stroke-opacity=".28"/><path d="M727 375L779 305" stroke="#8bbcff" stroke-opacity=".28"/><path d="M727 375L779 340" stroke="#8bbcff" stroke-opacity=".28"/><path d="M727 375L779 375" stroke="#8bbcff" stroke-opacity=".28"/></g><text x="728" y="447" text-anchor="middle" fill="#d9e7fc" font-size="21">Neural predictor</text>
<path d="M830 340H890" fill="none" stroke="#9fc6ff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="914" y="252" width="210" height="210" rx="6" fill="url(#texture)" stroke="#9fc6ff" stroke-width="3"/><rect x="914" y="252" width="210" height="210" rx="6" fill="url(#grid)"/>
<text x="1019" y="503" text-anchor="middle" fill="#d9e7fc" font-size="21" font-weight="700">Predicted block</text><text x="1019" y="535" text-anchor="middle" fill="#aebdce" font-size="18">Pattern continuation</text>
<text x="1145" y="636" text-anchor="end" fill="#8ca1ba" font-size="16">Conceptual illustration</text></g></svg>